<!-- Submit Content Modal -->
<div 
  x-show="showSubmitModal" 
  x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm transition-opacity"
  @keydown.escape.window="showSubmitModal = false"
>
  <div 
    @click.away="showSubmitModal = false"
    class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
    x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
    x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
  >
    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-white">Submit Content for Brand Check</h3>
          <p class="text-xs text-slate-400">Evaluate copy against approved guidelines and verified claim evidence</p>
        </div>
      </div>
      <button 
        @click="showSubmitModal = false" 
        class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition-colors"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Form -->
    <form action="/content/submit" method="POST" class="p-6 space-y-4 overflow-y-auto">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Document / Asset Title <span class="text-rose-400">*</span></label>
        <input 
          type="text" 
          name="title" 
          required 
          placeholder="e.g., Q4 Enterprise Security Whitepaper Launch"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
        />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Campaign Name</label>
          <input 
            type="text" 
            name="campaign" 
            placeholder="e.g., Global Trust 2026"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Marketing Channel</label>
          <select 
            name="channel"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
          >
            <option value="LinkedIn & Social">LinkedIn & Social Post</option>
            <option value="Landing Page Copy">Landing Page Copy</option>
            <option value="Email Newsletter">Email Newsletter</option>
            <option value="Press Release">Press Release</option>
            <option value="Paid Ad Copy">Paid Ad Copy (Google/Meta)</option>
            <option value="Whitepaper / Case Study">Whitepaper / Case Study</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">
          Content Copy to Validate <span class="text-rose-400">*</span>
        </label>
        <textarea 
          name="content_text" 
          required 
          rows="5"
          placeholder="Paste marketing copy, product claims, or promotional text here..."
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all leading-relaxed"
        ></textarea>
        <p class="text-[11px] text-slate-500 mt-1 flex items-center space-x-1">
          <i data-lucide="lock" class="w-3 h-3 text-slate-400"></i>
          <span>Privacy Protected: Content is processed with isolated zero-training compliance evaluation.</span>
        </p>
      </div>

      <input type="hidden" name="author_name" value="{{ current_user.name }}" />
      <input type="hidden" name="role" :value="activeRole" />

      <!-- Footer Buttons -->
      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
        <div class="text-xs text-slate-400 flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Rule checks: Tone, Superlatives, Claim Evidence, Disclaimers</span>
        </div>
        <div class="flex items-center space-x-3">
          <button 
            type="button" 
            @click="showSubmitModal = false"
            class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit"
            class="px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:scale-95 rounded-xl shadow-lg shadow-indigo-500/20 transition-all flex items-center space-x-2"
          >
            <i data-lucide="scan-line" class="w-4 h-4"></i>
            <span>Run Compliance Scan</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
